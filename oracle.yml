name: Oracle Macro Daily

on:
  schedule:
    # Lun-Ven à 22:30 UTC (après la clôture US, heure d'été comme d'hiver)
    - cron: "30 22 * * 1-5"
  workflow_dispatch:
    inputs:
      force_full:
        description: "Forcer un recalcul complet (ignore le cache)"
        type: boolean
        default: false

concurrency:
  group: oracle-macro
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Dépendances
        run: pip install -r requirements.txt

      - name: Restaurer l'état (modèles + historique)
        uses: actions/cache/restore@v4
        with:
          path: |
            output/models_v93.joblib
            output/history_v93.parquet
            output/meta_v93.json
            output/config.yaml
          key: oracle-state-${{ github.run_id }}
          restore-keys: |
            oracle-state-

      - name: Forcer le recalcul complet
        if: ${{ inputs.force_full }}
        run: rm -f output/models_v93.joblib output/history_v93.parquet output/meta_v93.json

      - name: Exécuter le pipeline
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_MODE: ${{ vars.MAIL_MODE || 'always' }}
          OUTPUT_DIR: output
        run: python oracle_macro.py

      - name: Sauvegarder l'état
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            output/models_v93.joblib
            output/history_v93.parquet
            output/meta_v93.json
            output/config.yaml
          key: oracle-state-${{ github.run_id }}

      - name: Archiver le dashboard
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dashboard
          path: output/Dashboard_*.html
          retention-days: 14
          if-no-files-found: ignore
